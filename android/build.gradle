allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// 兼容旧版 Flutter 插件包（使用 android.flutter.xxx 语法）
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.android
            if (!androidExt.extensions.findByName('flutter')) {
                androidExt.extensions.create('flutter', FlutterCompat)
            }
        }
    }
}

class FlutterCompat {
    def getCompileSdkVersion() { return 34 }
    def getMinSdkVersion() { return 24 }
    def getTargetSdkVersion() { return 34 }
    def getNdkVersion() { return "25.1.8937393" }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
