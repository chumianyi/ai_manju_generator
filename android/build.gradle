allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// 兼容旧版 Flutter 插件包（使用 android.flutter.xxx 语法）
// 在 android 插件应用后立即注入，必须早于子项目 build.gradle 执行
subprojects { project ->
    project.plugins.withId('com.android.library') {
        if (!project.android.extensions.findByName('flutter')) {
            project.android.extensions.create('flutter', FlutterCompat)
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

class FlutterCompat {
    def getCompileSdkVersion() { return 34 }
    def getMinSdkVersion() { return 24 }
    def getTargetSdkVersion() { return 34 }
    def getNdkVersion() { return "25.1.8937393" }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
